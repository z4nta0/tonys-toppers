<!doctype html><!-- What: Document Type Declaration. Why: Browsers render the page in standards mode only with a doctype. How: This declares HTML5. -->



<html lang='en'><!-- What: Root HTML Element. Why: The card is set in English text. How: This marks the document as English. -->


	<head><!-- What: Document Head Element. Why: The card's fonts and layout load before it's captured. How: This holds them in the sections below. -->


		<!-- #region Document -->

		<meta charset='UTF-8' />                          <!-- What: Character Set Meta. Why: The card's text has to decode as UTF-8. How: This sits first in the head. -->
		<title>Tony's Toppers Social Preview Card</title> <!-- What: Page Title Element. Why: The file should say what it is when opened in a browser. How: This names the card. -->

		<!-- #endregion Document -->


		<!-- #region Card Styles -->

		<style>/* What: Card Style Element. Why: The card is one fixed-size image, styled here from the site's own fonts and tokens. How: This imports the site's font faces and global stylesheet, then lays the card out on the site's scale, keeping literal pixels only for the image's fixed size. */


			@import url( '../../src/styles/fonts.css' );  /* What: Site Fonts Import. Why: The card should be set in the site's own typefaces. How: This loads the site's font faces, whose file paths resolve from fonts.css itself. */
			@import url( '../../src/styles/styles.css' ); /* What: Site Styles Import. Why: The card should read the site's colors and scale rather than copies of them. How: This loads the global tokens and base element styles, which also make 1rem the site's 11px base. */



			/* #region carBodBod */

			.carBodBod { /* What: Card Body Body. Why: The card fills the whole 1,200x630 capture on the hero's warm cream wash. How: This sizes it in literal pixels, the image's own fixed size, lays the hero's yellow and blue washes over the cream, and centers its single column. */


				align-items     : center;
				background      : radial-gradient( ellipse at 20% 10%, oklch( from var( --acc-sec-col ) l c h / var( --cdn-pow-006-rec ) ), transparent 50% ), radial-gradient( ellipse at 85% 80%, oklch( from var( --acc-mai-col ) l c h / 0.12 ), transparent 55% ), var( --bac-pag-col ); /* Accent Secondary Color = #fbbf24, Core-Design-Number to the Power of 6 Reciprocal ~= 0.185, Accent Main Color = #1e3a8a @ 0.12 opacity, Background Page Color = #fdf9ee */
				display         : flex;
				height          : 630px;
				justify-content : center;
				overflow        : hidden;
				position        : relative;
				width           : 1200px;


			}
			.carBodBod::before { /* What: Card Body Body Yellow Glow. Why: The hero's blurred yellow glow warms the top left corner. How: This draws the same half-transparent yellow circle, partly off the corner. */


				background    : var( --acc-sec-col );                        /* Accent Secondary Color = #fbbf24 */
				border-radius : 50%;
				content       : '';
				filter        : blur( calc( var( --ver-rhy-p04 ) * 1rem ) ); /* Vertical Rhythm Base Plus 4 ~= 44.876px */
				height        : calc( var( --ver-rhy-p11 ) * 1rem );         /* Vertical Rhythm Base Plus 11 ~= 321.273px */
				left          : calc( var( --spa-hor-p06 ) * -1 );           /* Spacing Horizontal Base Plus 6 ~= -78.751px */
				opacity       : 0.5;
				position      : absolute;
				top           : calc( var( --spa-ver-p06 ) * -1 );           /* Spacing Vertical Base Plus 6 ~= -78.751px */
				width         : calc( var( --ver-rhy-p11 ) * 1rem );         /* Vertical Rhythm Base Plus 11 ~= 321.273px */


			}
			.carBodBod::after { /* What: Card Body Body Blue Glow. Why: The hero's blurred blue glow balances the yellow in the bottom right corner. How: This draws the same lightened navy circle, partly off the corner. */


				background    : oklch( from var( --acc-mai-col ) calc( l + 0.132 ) calc( c + 0.037 ) calc( h + 2.02 ) ); /* Accent Main Color = #1e3a8a, lightened to ~= #3b5bc9 */
				border-radius : 50%;
				bottom        : calc( var( --spa-ver-p07 ) * -1 );                                                       /* Spacing Vertical Base Plus 7 ~= -104.323px */
				content       : '';
				filter        : blur( calc( var( --ver-rhy-p04 ) * 1rem ) );                                             /* Vertical Rhythm Base Plus 4 ~= 44.876px */
				height        : calc( var( --ver-rhy-p10 ) * 1rem );                                                     /* Vertical Rhythm Base Plus 10 ~= 242.522px */
				opacity       : 0.5;
				position      : absolute;
				right         : calc( var( --spa-hor-p05 ) * -1 );                                                       /* Spacing Horizontal Base Plus 5 ~= -59.447px */
				width         : calc( var( --ver-rhy-p10 ) * 1rem );                                                     /* Vertical Rhythm Base Plus 10 ~= 242.522px */


			}


			/* #region carColDiv */

			.carColDiv { /* What: Card Column Div. Why: Some apps crop the card to its center square, so everything that matters sits inside the middle 630px. How: This stacks the portrait and the two lines in one centered column above the glows. */


				align-items    : center;
				display        : flex;
				flex-direction : column;
				position       : relative;
				text-align     : center;
				z-index        : 1;


			}

			.carPorIma { /* What: Card Portrait Image. Why: Tony's cartoon is the face visitors know from the site and his table. How: This sets it in a circle at a rhythm step tall enough to lead the card, with the hero portrait's soft navy shadow. */


				border-radius : 50%;
				display       : block;
				filter        : drop-shadow( calc( var( --ver-rhy-p01 ) * 1rem ) calc( var( --ver-rhy-p04 ) * 1rem ) calc( var( --ver-rhy-bas ) * 1rem ) oklch( from var( --acc-mai-col ) l c h / var( --cdn-pow-003-rec ) ) ); /* Vertical Rhythm Base Plus 1 ~= 19.304px, Vertical Rhythm Base Plus 4 ~= 44.876px, Vertical Rhythm Base ~= 14.572px, Accent Main Color = #1e3a8a, Core-Design-Number to the Power of 3 Reciprocal ~= 0.430 */
				height        : calc( var( --ver-rhy-p10 ) * 1rem ); /* Vertical Rhythm Base Plus 10 ~= 242.522px */
				object-fit    : cover;
				width         : calc( var( --ver-rhy-p10 ) * 1rem ); /* Vertical Rhythm Base Plus 10 ~= 242.522px */


			}

			.carNamPar { /* What: Card Name Paragraph. Why: The business's name is the card's main line, large enough to read at thumbnail size. How: This sets it in the hero headline's heavy serif. */


				color          : var( --tex-mai-col );                    /* Text Main Color = #1a1a2e */
				font-family    : var( --fon-fam-sec );                    /* Font Family Secondary = 'Fraunces', Georgia, serif */
				font-size      : var( --fon-siz-p07 );                    /* Font Size Base Plus 7 ~= 78.751px */
				font-weight    : 800;
				letter-spacing : calc( var( --cdn-pow-012-rec ) * -1em ); /* Core-Design-Number to the Power of 12 Reciprocal ~= -0.034em */
				line-height    : var( --ver-rhy-m01 );                    /* Vertical Rhythm Base Minus 1 = 1 */
				margin         : var( --spa-ver-p03 ) 0 0;                /* Spacing Vertical Base Plus 3 ~= 33.876px */


			}


			/* #region carTagPar */

			.carTagPar { /* What: Card Tagline Paragraph. Why: The second line says what Tony makes and where, the way the hero's accent does. How: This sets it in the hero's serif, a step smaller than the name. */


				color          : var( --tex-mai-col );                    /* Text Main Color = #1a1a2e */
				font-family    : var( --fon-fam-sec );                    /* Font Family Secondary = 'Fraunces', Georgia, serif */
				font-size      : var( --fon-siz-p05 );                    /* Font Size Base Plus 5 ~= 44.876px */
				font-weight    : 800;
				letter-spacing : calc( var( --cdn-pow-012-rec ) * -1em ); /* Core-Design-Number to the Power of 12 Reciprocal ~= -0.034em */
				line-height    : var( --ver-rhy-m01 );                    /* Vertical Rhythm Base Minus 1 = 1 */
				margin         : var( --spa-ver-p02 ) 0 0;                /* Spacing Vertical Base Plus 2 ~= 25.572px */


			}

			.titAccSpa { /* What: Title Accent Span. Why: The tagline carries the hero's warmth. How: This sets it in navy italics, as an inline block so its highlight bar can sit beneath it, copied from the hero. */


				color      : var( --acc-mai-col ); /* Accent Main Color = #1e3a8a */
				display    : inline-block;
				font-style : italic;
				position   : relative;


			}
			.titAccSpa::after { /* What: Title Accent Highlight Bar. Why: A yellow bar under the words reads like a hand-drawn highlight. How: This draws the hero's slightly skewed yellow band across the bottom of the words, behind them. */


				background    : var( --acc-sec-col );                /* Accent Secondary Color = #fbbf24 */
				border-radius : var( --rad-bor-xsm );                /* Radius Border Extra Small ~= 3.572px */
				bottom        : var( --spa-ver-m05 );                /* Spacing Vertical Base Minus 5 ~= 3.572px */
				content       : '';
				height        : calc( var( --ver-rhy-bas ) * 1rem ); /* Vertical Rhythm Base ~= 14.572px */
				left          : calc( var( --spa-hor-m05 ) * -1 );   /* Spacing Horizontal Base Minus 5 ~= -3.572px */
				position      : absolute;
				right         : calc( var( --spa-hor-m05 ) * -1 );   /* Spacing Horizontal Base Minus 5 ~= -3.572px */
				transform     : skew( -3deg );
				z-index       : -1;


			}

			/* #endregion carTagPar */

			/* #endregion carColDiv */

			/* #endregion carBodBod */


		</style>

		<!-- #endregion Card Styles -->


	</head>



	<body class='carBodBod'><!-- What: Card Body Body Element. Why: This is the card itself. How: Its single column holds everything the image shows. -->


		<div class='carColDiv'><!-- What: Card Column Div Element. Why: The card's content sits in one centered column. How: This stacks the portrait, the name, and the tagline. -->


			<img
				class='carPorIma'

				src='../../src/pages/home/tony-cartoon.webp'

				alt='Cartoon illustration of Tony'
			/><!-- What: Card Portrait Image Element. Why: Tony's cartoon makes the card recognizable at a glance. How: This loads the same image the site's hero shows. -->

			<p class='carNamPar'>Tony's Toppers</p><!-- What: Card Name Paragraph Element. Why: The main line names the business. How: This shows it in the heavy serif. -->

			<p class='carTagPar'><span class='titAccSpa'>Handmade in Bolivar, MO</span></p><!-- What: Card Tagline Paragraph Element. Why: The second line says how the pieces are made and where. How: This shows it in navy italics over the yellow highlight bar. -->


		</div>


	</body>


</html>
