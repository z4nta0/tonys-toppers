<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/logo-notext.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tony's Toppers — Handcrafted Beaded Pens & Wine Stoppers</title>
  </head>
  <body>
    <div id="root"></div>
    <form
      data-netlify='true'
      name='contactForm'

      hidden
    ><!-- What: Netlify Detection Form Element. Why: Netlify finds forms by reading the deployed HTML, and the real contact form only exists once React renders it. How: This hidden, bare copy names the form and each field the React form submits, with no ids, so it never duplicates the real form's, and an aria-label on each field so accessibility checkers find every control named. -->
      <input
        name='name'

        type='text'

        aria-label='Name'
      /><!-- What: Name Input Element. Why: Netlify records only the fields it finds in this copy. How: This declares the name field, which carries the visitor's name. -->
      <input
        name='email'

        type='email'

        aria-label='Email'
      /><!-- What: Email Input Element. Why: Netlify records only the fields it finds in this copy. How: This declares the email field, which carries the visitor's email address. -->
      <select
        name='interest'

        aria-label='Interest'
      ></select><!-- What: Interest Select Element. Why: Netlify records only the fields it finds in this copy. How: This declares the interest field, which carries the kind of piece the visitor asked about. -->
      <textarea
        name='message'

        aria-label='Message'
      ></textarea><!-- What: Message Textarea Element. Why: Netlify records only the fields it finds in this copy. How: This declares the message field, which carries the visitor's note to Tony. -->
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
