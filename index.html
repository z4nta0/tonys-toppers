


<!doctype html><!-- What: Document Type Declaration. Why: Browsers render the page in standards mode only with a doctype. How: This declares HTML5. -->



<html lang='en'><!-- What: Root HTML Element. Why: Screen readers and translation tools need the page's language. How: This marks the document as English. -->


	<head><!-- What: Document Head Element. Why: The page's metadata, icons, social tags, and structured data load before the body paints. How: This holds them in the sections below. -->


		<!-- #region Document -->

		<meta charset='UTF-8' />                                                 <!-- What: Character Set Meta. Why: The browser has to decode the page as UTF-8 before it reads anything else. How: This sits first in the head, inside the first 1,024 bytes the browser checks. -->
		<meta name='viewport' content='width=device-width, initial-scale=1.0' /> <!-- What: Viewport Meta. Why: Phones should lay the site out at device width instead of a zoomed-out desktop width. How: This sets the layout width to the device's and starts at no zoom. -->
		<title>Tony's Toppers | Handmade Beaded Crafts in Bolivar, MO</title>    <!-- What: Page Title Element. Why: The tab, bookmarks, and search listings name the page by its title, and most visitors met Tony at a fair nearby and search for him afterward. How: This names the business, what it makes, and its town, in under 60 characters. -->

		<!-- #endregion Document -->


		<!-- #region Search -->

		<meta name='author'      content="Tony's Toppers" />      <!-- What: Author Meta. Why: Search engines and link preview inspectors look for who a page belongs to, and on a real business's site that's the business itself. How: This names Tony's Toppers. -->
		<link href='https://tonystoppers.com/' rel='canonical' /> <!-- What: Canonical Link. Why: Netlify also serves the site at deploy preview and netlify.app addresses, which should all count as one page. How: This names the live address as the page's own. -->
		<meta name='description' content='Handmade beaded pens, wine stoppers, keychains, and more by Tony Mawhiney of Bolivar, Missouri, sold at local craft fairs.' /> <!-- What: Description Meta. Why: Search listings show a short summary under the title, and it should name the maker, his town, and what he makes. How: This sums up Tony's pieces and where to find them, in about 120 characters so phones show it whole. -->

		<!-- #endregion Search -->


		<!-- #region Web App -->

		<meta name='theme-color' content='#fdf9ee' /> <!-- What: Theme Color Meta. Why: Mobile browsers tint their chrome around the page, and Discord edges its link previews in this color. How: This sets it to the cream of the bar and page. -->

		<!-- #endregion Web App -->


		<!-- #region Icons -->

		<!--
			index.html = Icons Section

			@summary
			The SVG comes first, since modern browsers prefer it and it stays
			sharp at any tab density, then the root favicon.ico for older
			browsers, then the PNG sizes from smallest to largest. Every raster
			icon is rendered from favicon.svg by npm run icons. The order is
			the browser's order of preference, so it stays as written rather
			than alphabetical.

			@author z4nta0 <https://github.com/z4nta0>

		-->



		<link href='/favicon.svg'         rel='icon' type='image/svg+xml' />             <!-- What: SVG Icon Link. Why: Modern browsers prefer a vector favicon that stays sharp at any tab density. How: This points at the Tony's Toppers mark, its ring and TT on a white disc so the mark holds up on a dark tab bar. -->
		<link href='/favicon.ico'         rel='icon' sizes='any' />                      <!-- What: ICO Icon Link. Why: The icon is offered as a .ico too, the format favicons began with. How: This points at the root favicon.ico, which also answers the request browsers make for it on their own. -->
		<link href='/favicon-16x16.png'   rel='icon' sizes='16x16'   type='image/png' /> <!-- What: Small PNG Icon Link. Why: Small tab icons look crisper drawn at their own size. How: This offers the 16px PNG. -->
		<link href='/favicon-32x32.png'   rel='icon' sizes='32x32'   type='image/png' /> <!-- What: Medium PNG Icon Link. Why: A browser without SVG favicons needs a raster fallback at a common tab size. How: This offers the 32px PNG. -->
		<link href='/favicon-192x192.png' rel='icon' sizes='192x192' type='image/png' /> <!-- What: Large PNG Icon Link. Why: A large icon serves shortcuts and tab previews. How: This offers the 192px PNG. -->
		<link href='/favicon-512x512.png' rel='icon' sizes='512x512' type='image/png' /> <!-- What: Extra Large PNG Icon Link. Why: High-density screens and app launchers can ask for a bigger icon still. How: This offers the 512px PNG. -->

		<!-- #endregion Icons -->


		<!-- #region Home Screen -->

		<link href='/apple-touch-icon.png' rel='apple-touch-icon' sizes='180x180' /> <!-- What: Apple Touch Icon Link. Why: iOS draws the home screen icon, and some apps the icon beside a shared link, from this link. How: This points at the 180px touch icon, the mark a little inset on a solid white square. -->

		<!-- #endregion Home Screen -->


		<!-- #region Open Graph -->

		<meta property='og:description'  content='Handmade beaded pens, wine stoppers, keychains, and more by Tony Mawhiney of Bolivar, Missouri, sold at local craft fairs.' /> <!-- What: Open Graph Description Meta. Why: A shared link shows a summary under its title. How: This repeats the page's description, which already fits the 125 characters phones show. -->
		<meta property='og:image'        content='https://tonystoppers.com/og-image.jpg' />                                    <!-- What: Open Graph Image Meta. Why: A shared link shows a preview image. How: This points at the 1,200x630 card in public/, by its absolute address. -->
		<meta property='og:image:alt'    content="Cartoon of Tony above the words Tony's Toppers, Handmade in Bolivar, MO." /> <!-- What: Open Graph Image Alt Meta. Why: Screen readers on social sites read the preview image's description. How: This describes what the card shows. -->
		<meta property='og:image:height' content='630' />                                                                      <!-- What: Open Graph Image Height Meta. Why: Sites can lay out the preview before the image loads. How: This gives the card's height. -->
		<meta property='og:image:type'   content='image/jpeg' />                                                               <!-- What: Open Graph Image Type Meta. Why: Some apps check an image's type before fetching it. How: This names JPEG, which keeps the card's soft color washes well under WhatsApp's 300 KB limit. -->
		<meta property='og:image:width'  content='1200' />                                                                     <!-- What: Open Graph Image Width Meta. Why: Sites can lay out the preview before the image loads. How: This gives the card's width. -->
		<meta property='og:locale'       content='en_US' />                                                                    <!-- What: Open Graph Locale Meta. Why: Sites can tell which language the page is in. How: This names US English. -->
		<meta property='og:site_name'    content="Tony's Toppers" />                                                           <!-- What: Open Graph Site Name Meta. Why: Previews show which site a link belongs to. How: This names the business the way the site does everywhere. -->
		<meta property='og:title'        content="Tony's Toppers | Handmade Beaded Crafts in Bolivar, MO" />                   <!-- What: Open Graph Title Meta. Why: A shared link shows a title. How: This matches the page title. -->
		<meta property='og:type'         content='website' />                                                                  <!-- What: Open Graph Type Meta. Why: Sites shape a preview by what kind of page it is. How: This marks it a website. -->
		<meta property='og:url'          content='https://tonystoppers.com/' />                                                <!-- What: Open Graph URL Meta. Why: Shares from any address should count as one page. How: This names the live address, matching the canonical link. -->

		<!-- #endregion Open Graph -->


		<!-- #region Twitter Card -->

		<meta name='twitter:card'        content='summary_large_image' /> <!-- What: Twitter Card Meta. Why: X and similar sites pick a preview layout from this tag. How: This asks for the large image layout, which suits the 1,200x630 card. -->
		<meta name='twitter:description' content='Handmade beaded pens, wine stoppers, keychains, and more by Tony Mawhiney of Bolivar, Missouri, sold at local craft fairs.' /> <!-- What: Twitter Description Meta. Why: The preview shows a summary. How: This repeats the page's description. -->
		<meta name='twitter:image'       content='https://tonystoppers.com/og-image.jpg' />                                                                                      <!-- What: Twitter Image Meta. Why: The preview shows an image. How: This points at the same card as Open Graph. -->
		<meta name='twitter:image:alt'   content="Cartoon of Tony above the words Tony's Toppers, Handmade in Bolivar, MO." />                                                   <!-- What: Twitter Image Alt Meta. Why: Screen readers read the preview image's description. How: This repeats the Open Graph alt text. -->
		<meta name='twitter:title'       content="Tony's Toppers | Handmade Beaded Crafts in Bolivar, MO" />                                                                     <!-- What: Twitter Title Meta. Why: The preview shows a title. How: This matches the page title. -->

		<!-- #endregion Twitter Card -->


		<!-- #region Structured Data -->

			{

					{

						"@id": "https://tonystoppers.com/#tony",

		</script><!-- What: Site Structured Data Script. Why: Search engines read JSON-LD to tell who the site belongs to and who makes the pieces, and every detail has to match what the page shows. How: This links an Organization for Tony's Toppers, with its live address, phone, logo, preview image, Bolivar, Missouri with no street address, and its Facebook page, to a Person for Tony as its founder and maker, with no birth date, and a WebSite published by the business. -->

		<!-- #endregion Structured Data -->


	</head>



	<body><!-- What: Document Body Element. Why: This holds the site's mount point, the form copy Netlify reads, and the entry script. How: The mount point stays empty until React renders the site into it. -->


		<div id='appMouDiv'></div><!-- What: App Mount Div Element. Why: React needs one element to render the site into. How: main.tsx renders the app into this ID. -->

		<form
			data-netlify='true'
			name='contactForm'

			hidden
		><!-- What: Netlify Detection Form Element. Why: Netlify finds forms by reading the deployed HTML, and the real contact form only exists once React renders it. How: This hidden, bare copy names the form and each field the React form submits, with no IDs, so it never duplicates the real form's, and an aria-label on each field so accessibility checkers find every control named. -->


			<input
				name='name'

				type='text'

				aria-label='Name'
			/><!-- What: Name Input Element. Why: Netlify records only the fields it finds in this copy. How: This declares the name field, which carries the visitor's name. -->

			<input
				name='email'

				type='email'

				aria-label='Email'
			/><!-- What: Email Input Element. Why: Netlify records only the fields it finds in this copy. How: This declares the email field, which carries the visitor's email address. -->

			<select
				name='interest'

				aria-label='Interest'
			></select><!-- What: Interest Select Element. Why: Netlify records only the fields it finds in this copy. How: This declares the interest field, which carries the kind of piece the visitor asked about. -->

			<textarea
				name='message'

				aria-label='Message'
			></textarea><!-- What: Message Textarea Element. Why: Netlify records only the fields it finds in this copy. How: This declares the message field, which carries the visitor's note to Tony. -->


		</form>

		<script
			src='/src/main.tsx'
			type='module'
		>/* What: Site Module Script Element. Why: This loads the site itself. How: Vite replaces it with the built, hashed bundle at build time. */</script>


	</body>


</html>
